name: Cazar Servidor Oracle Minecraft

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Evita que se amontonen ejecuciones paralelas y bloqueen el Stack
concurrency:
  group: cazar-oracle
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  intentar_creacion:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configurar credenciales OCI
        env:
          KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
        run: |
          mkdir -p ~/.oci
          echo "$KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF

      - name: Bucle cazador continuo
        id: cazador
        run: |
          STACK_ID="ocid1.ormstack.oc1.sa-bogota-1.amaaaaaaxrasalaafrnqcyzh2d6mx7vusyk3duaum7qtv4sztrj7iz3adsxa"
          
          # 60 intentos consecutivos (~20-25 minutos continuos)
          for i in {1..60}; do
            TIMESTAMP=$(date '+%Y%m%d%H%M%S')
            echo "=========================================="
            echo "Intento $i/60 - [$(date '+%H:%M:%S')] Probando cupo en Bogotá (2 OCPU / 12 GB)..."
            
            JOB_OUTPUT=$(oci resource-manager job create-apply-job \
              --stack-id "$STACK_ID" \
              --execution-plan-strategy AUTO_APPROVED \
              --display-name "apply-job-$TIMESTAMP" \
              --wait-for-state SUCCEEDED --wait-for-state FAILED \
              --wait-interval-seconds 10 2>&1) || true
            
            if echo "$JOB_OUTPUT" | grep -q '"lifecycle-state": *"SUCCEEDED"'; then
              echo "¡¡¡CAPACIDAD CAPTURADA CON ÉXITO EN BOGOTÁ!!!"
              echo "exito=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            echo "Sin cupo. Esperando 20 segundos..."
            sleep 20
          done
          echo "exito=false" >> $GITHUB_OUTPUT

      - name: Auto-reiniciar siguiente ciclo (24/7 continuo)
        if: steps.cazador.outputs.exito != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Ronda finalizada sin éxito. Disparando la siguiente ronda de inmediato..."
          gh workflow run cazar.yml --repo ${{ github.repository }}
