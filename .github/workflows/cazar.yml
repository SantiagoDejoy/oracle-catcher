name: Cazar Servidor Oracle Minecraft

on:
  schedule:
    # Se ejecuta automáticamente cada 10 minutos 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite activarlo manualmente en cualquier momento

jobs:
  intentar_creacion:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configurar credenciales OCI
        env:
          KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
        run: |
          mkdir -p ~/.oci
          echo "$KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF

      - name: Lanzar Apply Job al Stack
        run: |
          STACK_ID="ocid1.ormstack.oc1.sa-bogota-1.amaaaaaaxrasalaafrnqcyzh2d6mx7vusyk3duaum7qtv4sztrj7iz3adsxa"
          
          echo "Lanzando intento hacia Oracle Resource Manager en Bogotá..."
          JOB_JSON=$(oci resource-manager job create-apply-job \
            --stack-id "$STACK_ID" \
            --execution-plan-strategy AUTO_APPROVED \
            --wait-for-state SUCCEEDED --wait-for-state FAILED \
            --wait-interval-seconds 10 2>&1)

          if echo "$JOB_JSON" | grep -q '"lifecycle-state": *"SUCCEEDED"'; then
            echo "=========================================="
            echo "¡INSTANCIA AMPERE CAPTURADA CON ÉXITO!"
            echo "=========================================="
            exit 0
          else
            echo "Sin stock en este intento. El próximo ciclo se ejecutará automáticamente."
            exit 0
          fi
